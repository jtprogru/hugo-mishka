baseURL: "https://example.org/"
defaultContentLanguage: "ru"
languages:
  ru:
    label: "Русский"
    locale: "ru-RU"
    weight: 1
title: "Mishka — демо"
theme: "hugo-mishka"

# При локальной разработке темы Hugo подтягивает её отсюда же.
# Если запускаешь exampleSite извне (вне monorepo темы), используй
# либо submodule в themes/hugo-mishka, либо hugo mod get.
themesDir: "../.."

enableEmoji: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
summaryLength: 20

pagination:
  pagerSize: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON
  page:
    - HTML

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    lineNos: false
    codeFences: true
    guessSyntax: true
    tabWidth: 2
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false

related:
  includeNewer: true
  threshold: 60
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 70

menu:
  main:
    - identifier: posts
      name: "Посты"
      url: "/posts/"
      weight: 10
    - identifier: tags
      name: "Теги"
      url: "/tags/"
      weight: 20
    - identifier: projects
      name: "Проекты"
      url: "/projects/"
      weight: 25
    - identifier: search
      name: "Поиск"
      url: "/search/"
      weight: 30

params:
  env: development
  author: "Mishka Demo"
  description: "Демо-сайт для разработки Hugo-темы Mishka."
  mainSections: ["posts"]

  defaultTheme: auto
  ShowReadingTime: true
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowToc: true
  ShowShareButtons: true
  ShowRelatedPosts: true
  relatedMax: 4
  math: false
  mermaid: false

  # Блок «Мои проекты» на главной. Источник — data/projects.yaml.
  # enabled       — false полностью скрывает блок (страница /projects/ остаётся).
  # featuredOnly  — true: показывать только проекты с `featured: true`.
  # limit         — потолок карточек (по умолчанию 6).
  # moreLink      — ссылка «Все проекты →» под сеткой (пусто = не показывать).
  homeSections:
    projects:
      enabled: true
      featuredOnly: false
      limit: 6
      moreLink: /projects/

  profileMode:
    enabled: true
    title: "Mishka"
    subtitle: "Демо-сайт для тестирования Hugo-темы."
    imageUrl: "/images/avatar.svg"
    imageHeight: 150
    imageWidth: 150
    latestPostsCount: 6

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  socialIcons:
    - name: github
      url: "https://github.com/jtprogru/hugo-mishka"
    - name: rss
      url: "/index.xml"

  editPost:
    URL: "https://github.com/jtprogru/hugo-mishka/edit/main/exampleSite/content"
    Text: "Suggest changes"
    appendFilePath: true

  # Telegram-канал для IV-метатега te:channel (опционально).
  telegramChannel: "@hugo_mishka_demo"

  # Git-commit в футере (опционально). Можно задать вручную или через
  # ENV MISHKA_COMMIT (приоритет у env). commitURL — printf-шаблон с %s.
  commit: "abc1234"
  commitURL: "https://github.com/jtprogru/hugo-mishka/commit/%s"

  # PWA: manifest + service worker + offline-страница.
  PWA:
    enabled: true
    manifestPath: "/manifest.json"
    themeColor: "#c2410c"
