{{- /* Принудительный RTL-блок.

       Использование (на LTR-сайте, когда нужно вставить кусок RTL-текста
       — арабский, иврит, фарси):

         {{< rtl lang="ar" >}}
         مرحبا بالعالم
         {{< /rtl >}}

       Inline-вариант доступен через `<span dir="rtl">…</span>` напрямую. */ -}}
<div dir="rtl" lang="{{ .Get "lang" | default "ar" }}">{{ .Inner | $.Page.RenderString }}</div>
