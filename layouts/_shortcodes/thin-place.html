{{- /* «Тонкое место»: эпиграф / врезка с особой типографикой.
       {{< thin-place author="Кто это сказал" >}}Текст{{< /thin-place >}} */ -}}
{{- $author := .Get "author" -}}
<figure class="thin-place">

</figure>
